version: 3
tasks:
  dev:
    deps: [install]
    cmd: npx vitest

  lint:
    deps: [install]
    cmds:
      - npm run lint:eslint
      - npm run lint:prettier

  test:
    deps: [install, lint]
    cmds:
      - npx vitest run

  release:
    deps: [install]
    cmd: npx release-it --only-version

  install-language:
    run: once
    status:
      - asdf current nodejs
    cmd: asdf install

  install-deps:
    aliases: [install, install-dependencies]
    run: when_changed
    sources:
      - package-json
      - package-lock.json
    generates:
      - package-lock.json
      - node_modules/**/*
    deps:
      - install-language
    cmd: npm i
